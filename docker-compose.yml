version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: object_detection_server
    command: python server.py
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: object_detection_client
    depends_on:
      - server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_PROXY_TARGET=http://server:5000
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  client_node_modules:
